services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ionailabs-canvas-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_PATH: /app/data/ionailabs-canvas.sqlite
    volumes:
      - ./data:/app/data
    expose:
      - "4000"
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ionailabs-canvas-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
