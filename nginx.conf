limit_req_zone $binary_remote_addr zone=uozi_api:10m rate=5r/s;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 浏览器同源访问该固定路径，再由 Nginx 转发到 Uozi API，避免上游 CORS 限制。
    # API Key 仍由浏览器随请求传入，不保存在 Render 或镜像中。
    location /api/uozi/ {
        if ($http_authorization !~* "^Bearer .+$") {
            return 401;
        }

        limit_except GET POST {
            deny all;
        }

        limit_req zone=uozi_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 50m;

        # 结尾斜杠会把 /api/uozi/v1/... 映射为上游的 /v1/...。
        proxy_pass https://ai-api.uozi.org/;
        proxy_ssl_server_name on;
        proxy_ssl_name ai-api.uozi.org;
        proxy_set_header Host ai-api.uozi.org;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Connection "";

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
